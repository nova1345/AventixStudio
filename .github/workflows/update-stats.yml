name: Update stats

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual run button
  push:
    branches: [main]
    paths:
      - 'config.cjs'
      - 'scripts/build-data.cjs'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data.json
        run: node scripts/build-data.cjs
      - name: Commit if changed
        run: |
          git config user.name "aventix-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update live stats [skip ci]"
          git push
